<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Countdown Timer para a véspera de Ano Novo. Site e Design por Igor Gomes. Imagem por Gabriel." />
        <meta name="theme-color" content="#1a2536" />
        <title>Countdown Timer | New Years Eve</title>

        <!-- Google Fonts: Poppins (original) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

        <!-- Stylesheet com cache-buster -->
        <link rel="stylesheet" href="style.css?v=3.0" />

        <!-- Script com cache-buster -->
        <script src="script.js?v=3.0" defer></script>
    </head>
    <body>
        <!-- Canvas para efeito sutil de neve caindo em segundo plano -->
        <canvas id="snow-canvas" aria-hidden="true"></canvas>

        <main class="content-wrapper">
            <!-- Título original -->
            <header>
                <h1 id="title">New Years Eve</h1>
                <p class="subtitle" id="target-year">Contagem regressiva para o Ano Novo</p>
            </header>

            <!-- Container do Contador (IDs e classes originais 100% preservados) -->
            <div class="countdown-container">
                <div class="countdown-el days-c">
                    <p class="big-text" id="days">0</p>
                    <span>dias</span>
                </div>
                <div class="countdown-el hours-c">
                    <p class="big-text" id="hours">00</p>
                    <span>horas</span>
                </div>
                <div class="countdown-el mins-c">
                    <p class="big-text" id="mins">00</p>
                    <span>min</span>
                </div>
                <div class="countdown-el seconds-c">
                    <p class="big-text" id="seconds">00</p>
                    <span>seg</span>
                </div>
            </div>
        </main>

        <!-- Rodapé original preservado e centralizado -->
        <div class="end">
            <footer>
                <p>Image By <strong>Gabriel</strong></p>
                <span class="sep">•</span>
                <p>Site and Design By <strong>Igor Gomes</strong></p>
            </footer>
        </div>
    </body>
</html>
